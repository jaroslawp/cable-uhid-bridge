name: RPM

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  rpm:
    name: Build RPM (${{ matrix.dist }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist: fedora43
            image: registry.fedoraproject.org/fedora:43
          - dist: fedora44
            image: registry.fedoraproject.org/fedora:44
          - dist: fedora45
            image: registry.fedoraproject.org/fedora:45
          - dist: almalinux9
            image: quay.io/almalinuxorg/almalinux:9
          - dist: almalinux10
            image: quay.io/almalinuxorg/almalinux:10
    container:
      image: ${{ matrix.image }}

    steps:
      # git has to be present before checkout, otherwise actions/checkout falls
      # back to a tarball download and build-rpm.sh has no repository to read.
      - name: Install git
        run: dnf -y install git-core

      # Full history: the RPM changelog is generated from it.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: ./contrib/rpm/install-build-deps.sh

      - name: Build RPM and SRPM
        run: ./contrib/build-rpm.sh

      - name: Collect packages
        run: |
          mkdir -p dist
          cp target/rpm/RPMS/*/*.rpm target/rpm/SRPMS/*.src.rpm dist/
          ls -l dist

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.dist }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Attach RPMs to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: dist
          merge-multiple: true

      # The debuginfo/debugsource packages and the 100 MB SRPMs stay in the
      # workflow artifacts; only the installable packages go on the release.
      - name: Select release packages and generate checksums
        run: |
          mkdir release
          cp dist/cable-uhid-bridge-[0-9]*.x86_64.rpm release/
          cd release
          sha256sum *.rpm > SHA256SUMS-rpm.txt
          cat SHA256SUMS-rpm.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
